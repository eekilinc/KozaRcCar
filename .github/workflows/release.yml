name: Release APK

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/gradle-build-action@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build APK for Release
        run: |
          flutter clean
          flutter build apk --release

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          body: |
            🚀 **KOZA RC Araba Kontrol Uygulaması**
            
            Bu sürüm aşağıdaki özellikleri içerir:
            
            ✨ **Yenilikler:**
            - Son bağlanan cihazlar geçmişini silme özelliği
            - Hızlı cihaz erişimi (son 5 cihaz)
            - Bluetooth Classic ve BLE desteği
            - RC kontrolü (D-Pad, Joystick, Instant Mode)
            - İşaret gücü göstergesi
            - Türkçe ve İngilizce dil desteği
            
            📱 **Gereksinimler:**
            - Android 5.0 (API 21) ve üzeri
            - Bluetooth 4.0 (HC-06 veya BLE cihazları)
            
            🔧 **Kurulum:**
            APK dosyasını indirip Android cihazınıza yükleyin.
            
            📖 **Kullanım:**
            1. Uygulamayı açın
            2. Bluetooth modu seçin (Classic veya BLE)
            3. RC araç cihazını seçin
            4. Kontrolleri kullanarak araç yönetin
          draft: false
          prerelease: false
